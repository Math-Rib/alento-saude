<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alento Saúde</title>

    <link rel="stylesheet" href="/assets/css/gestaoagendamedico.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->
    <header class="alento-header">

        <!-- TOP BAR -->
        <div class="top-bar">

            <div class="top-bar-right">

                <!-- MODO NOTURNO -->
                <div class="top-bar-item">

                    <img id="img-modo-noturno"
                        src="https://cdn-icons-png.flaticon.com/512/581/581601.png"
                        alt="Modo Noturno">

                    <div id="toggle-dark-mode"
                        class="toggle-dark-mode"></div>

                </div>

                <!-- AJUDA -->
                <div class="top-bar-item">

                    <button class="btn-ajuda">

                        <img src="https://cdn-icons-png.flaticon.com/512/471/471664.png"
                            alt="Ajuda">

                        Ajuda

                    </button>

                </div>

            </div>

        </div>

        <!-- HEADER PRINCIPAL -->
        <div class="main-header">

            <!-- LOGO -->
            <a class="alento-logo" href="#">

                <img src="https://cdn-icons-png.flaticon.com/512/2966/2966486.png"
                    alt="Logo">

                <h2>Alento Saúde</h2>

            </a>

            <!-- MENU -->
            <nav class="alento-nav">

                <a href="#">Início</a>

                <a href="#">Especialidades</a>

                <a href="#">Sobre nós</a>

                <a href="#">Contato</a>

                <a id="btn-entrar" href="#">
                    Entrar
                </a>

            </nav>

        </div>

    </header>

    <!-- CONTAINER -->
    <main class="container">

        <!-- TÍTULO -->
        <div class="titulo-area">

            <div>

                <h1>Gestão de agenda médica</h1>

                <p>
                    Gerencie horários e consultas médicas
                </p>

            </div>

            <button id="novoAgendamento"
                class="novo-btn">

                <i class="fa-solid fa-plus"></i>

                Novo agendamento

            </button>

        </div>

        <!-- FILTROS -->
        <div class="filtros">

            <!-- MÉDICOS -->
            <select>

                <option>Dr. Lucas Almeida</option>
                <option>Dra. Fernanda Costa</option>
                <option>Dr. Rafael Lima</option>
                <option>Dra. Juliana Souza</option>
                <option>Dr. Carlos Henrique</option>

            </select>

            <!-- ESPECIALIDADES -->
            <select>

                <option>Clínico Geral</option>
                <option>Cardiologia</option>
                <option>Pediatria</option>
                <option>Neurologia</option>
                <option>Ortopedia</option>
                <option>Dermatologia</option>

            </select>

            <!-- CLÍNICAS -->
            <select>

                <option>Clínica Alento Saúde</option>
                <option>Hospital Vida+</option>
                <option>Centro Médico Brasil</option>

            </select>

        </div>

        <!-- FORMULÁRIO -->
        <section id="formulario"
            class="formulario hidden">

            <h2>Novo Agendamento</h2>

            <div class="form-grid">

                <input type="text"
                    id="paciente"
                    placeholder="Nome do paciente">

                <select id="diaSemana">

                    <option value="seg">Segunda</option>
                    <option value="ter">Terça</option>
                    <option value="qua">Quarta</option>
                    <option value="qui">Quinta</option>
                    <option value="sex">Sexta</option>

                </select>

                <input type="time"
                    id="horario">

            </div>

            <button id="salvarConsulta"
                class="salvar-btn">

                Salvar Consulta

            </button>

        </section>

        <!-- AGENDA -->
        <section class="agenda">

            <div class="agenda-topo">

                <h2>Agenda Semanal</h2>

                <div class="calendario-controles">

                    <button id="prevSemana">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>

                    <span id="dataAtual"></span>

                    <button id="nextSemana">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>

                </div>

            </div>

            <!-- GRID -->
            <div class="agenda-grid">

                <!-- HORÁRIOS -->
                <div class="horarios">

                    <div class="hora">07:00</div>
                    <div class="hora">08:00</div>
                    <div class="hora">09:00</div>
                    <div class="hora">10:00</div>
                    <div class="hora">11:00</div>
                    <div class="hora">12:00</div>
                    <div class="hora">13:00</div>
                    <div class="hora">14:00</div>
                    <div class="hora">15:00</div>
                    <div class="hora">16:00</div>
                    <div class="hora">17:00</div>

                </div>

                <!-- SEMANA -->
                <div class="semana">

                    <!-- SEG -->
                    <div class="dia">

                        <h3 id="segTitulo"></h3>

                        <div id="seg"
                            class="cards"></div>

                    </div>

                    <!-- TER -->
                    <div class="dia">

                        <h3 id="terTitulo"></h3>

                        <div id="ter"
                            class="cards"></div>

                    </div>

                    <!-- QUA -->
                    <div class="dia">

                        <h3 id="quaTitulo"></h3>

                        <div id="qua"
                            class="cards"></div>

                    </div>

                    <!-- QUI -->
                    <div class="dia">

                        <h3 id="quiTitulo"></h3>

                        <div id="qui"
                            class="cards"></div>

                    </div>

                    <!-- SEX -->
                    <div class="dia">

                        <h3 id="sexTitulo"></h3>

                        <div id="sex"
                            class="cards"></div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- JS -->
    <script src="/assets/js/pages/gestaoagendamedico.js"></script>

</body>

</html>
